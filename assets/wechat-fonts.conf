<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  WeChat (Flatpak) 专用字体配置
  被 home.nix 安装到: ~/.var/app/com.tencent.WeChat/config/fontconfig/fonts.conf
  只影响微信这个应用, 不影响系统里其它程序。

  微信用的是这套 CSS 字体栈:
    Microsoft YaHei, PingFang SC, Hiragino Sans GB,
    Source Han Sans CN, Noto Sans CJK SC, sans-serif
  这些字体在 Linux 上基本都没有, flatpak 沙箱里默认被替换成 DejaVu Sans(拉丁)
  + 逐字回退到别的中文字体, 于是中英文混排就很"奇怪"。
  下面把整条字体栈统一指向一个中文字体。

  ── 想换字体: 把下面出现的 "Noto Sans CJK SC" 全部替换掉即可 ──
  可选(本机已安装, 用 fc-list :lang=zh-cn family | sort -u 可查更多):
    Noto Sans CJK SC    思源黑体, 最接近微信原生界面(推荐)
    Source Han Sans SC  与 Noto Sans CJK SC 同源
    Sarasa Gothic SC    更纱黑体, 中英混排协调, 字形偏窄
    Sarasa UI SC        更纱 UI 版
    WenQuanYi Micro Hei 文泉驿微米黑(系统当前默认字体)
-->
<fontconfig>
  <description>WeChat Flatpak font override</description>

  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Hiragino Sans GB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Source Han Sans CN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
