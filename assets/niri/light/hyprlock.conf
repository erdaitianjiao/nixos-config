# ── 锁屏（hyprlock）—— Matcha 浅绿主题 ─────────────────────────
# niri 官方推荐的锁屏（比 swaylock 好看很多）：
# 背景 = 当前桌面截图 + 毛玻璃，大号时钟 + 圆角密码框，GPU 加速。
# 参考 https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# 改完不用重登，按 Super+Alt+L 立即看效果。

$font = Sarasa Gothic SC

general {
    hide_cursor = true
    fail_timeout = 2500
    # 若截图 / 模糊在你的机器上异常，取消下一行注释改用 shm 拷贝（更兼容、稍慢）
    # screencopy_mode = 1
}

animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOutExpo
    animation = fadeOut, 1, 3, easeOutExpo
    animation = inputFieldDots, 1, 1.5, easeOutExpo
}

# 背景：截当前屏 + 毛玻璃 + 压暗
background {
    monitor =
    path = screenshot
    color = rgba(1a1b26ff)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 1.0
    brightness = 0.68
    vibrancy = 0.16
    vibrancy_darkness = 0.0
}

# 时间
label {
    monitor =
    text = <b>$TIME</b>
    font_family = $font
    font_size = 116
    color = rgba(ffffffff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000059)
    position = 0, 150
    halign = center
    valign = center
}

# 日期（%A 跟随 locale，中文显示成「星期四」）
label {
    monitor =
    text = cmd[update:60000] date +"%Y年%m月%d日  %A"
    font_family = $font
    font_size = 26
    color = rgba(ffffffd9)
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(00000059)
    position = 0, 70
    halign = center
    valign = center
}

# 用户名（$DESC = GECOS，即 users.users.tianjiao.description）
label {
    monitor =
    text = $DESC
    font_family = $font
    font_size = 20
    color = rgba(ffffffa6)
    position = 0, 10
    halign = center
    valign = center
}

# 密码框
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(4f9d57ff)
    inner_color = rgba(0e1512d9)
    font_color = rgba(ffffffff)
    font_family = $font
    placeholder_text = 输入密码解锁…
    fail_text = 密码错误 ($ATTEMPTS)
    check_color = rgba(4f9d57ff)
    fail_color = rgba(d86666ff)
    capslock_color = rgba(c39a3fff)
    numlock_color = rgba(ffffffff)
    bothlock_color = rgba(c39a3fff)
    fade_on_empty = false
    dots_size = 0.24
    dots_spacing = 0.24
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000040)
    zindex = 10
}
