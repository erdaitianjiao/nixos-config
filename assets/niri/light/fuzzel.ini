# ── Fuzzel — Quickshell Blue（Material 风格，浅蓝）─────

[main]
font=CaskaydiaCove Nerd Font:size=11
dpi-aware=yes
prompt="󰍉 "
placeholder="搜索应用…"
icon-theme=Tela-dark
icons-enabled=yes
terminal=kitty
lines=12
width=40
horizontal-pad=24
vertical-pad=16
inner-pad=6
line-height=26
match-mode=fzf
anchor=center
layer=overlay
use-bold=no

[colors]
background=eef4fbe6
text=22303fff
prompt=4d87c8ff
placeholder=8fa2b4ff
input=22303fff
match=3f7fc0ff
selection=d3e6f9ff
selection-text=1b2836ff
selection-match=2f6fb0ff
border=bcd4edff

[border]
width=1
radius=20
selection-radius=12

[dmenu]
exit-immediately-if-empty=no
