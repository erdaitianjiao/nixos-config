# ── Kitty config — Quickshell Blue（白天浅蓝主题）────────

# 字体
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# 窗口
# 背景不透明度：1.0 = 完全不透明，越低越透（0～1）。
# 想临时试别的值不用改配置：kitty -o background_opacity=0.6
# 改了配置后按 ctrl+shift+f5 重载。
background_opacity 0.70
# 允许实时调透明度（默认键位，> 是前缀）：
#   ctrl+shift+a 然后 l → 降 0.1      m → 升 0.1
#   ctrl+shift+a 然后 1 → 回到 1.0    d → 回到配置里的默认值
# ⚠️ 这个开关要【重启 kitty】才生效，只重载配置不行。
dynamic_background_opacity yes
window_padding_width 10
window_margin_width 8
confirm_os_window_close 0
hide_window_decorations no

# 光标
cursor        #4d87c8
cursor_shape  block
cursor_blink_interval 0

# 提示音（关掉，别哔哔）
enable_audio_bell no
visual_bell_duration 0.0

# ── Quickshell Blue 配色（对齐 Clavis 的 Material 蓝）────
foreground            #22303f
background            #eef4fb
selection_foreground  #1b2836
selection_background  #c3daf2

# 普通色（black / red / green / yellow / blue / magenta / cyan / white）
color0  #dce8f5
color1  #d86666
color2  #3fa98e
color3  #c39a3f
color4  #4d87c8
color5  #8a7bc0
color6  #3fa0b8
color7  #22303f

# 亮色
color8  #9fb2c6
color9  #e07f7f
color10 #4fb8a0
color11 #d0a95a
color12 #6a9ed4
color13 #a595d0
color14 #56b8c8
color15 #f8fbff

# Tab 栏
active_tab_foreground   #eef4fb
active_tab_background   #4d87c8
inactive_tab_foreground #5a6b7a
inactive_tab_background #dce8f5
tab_bar_background      #dce8f5
tab_bar_margin_width    0.0
tab_bar_min_tabs        1
