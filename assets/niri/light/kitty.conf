# ── Kitty config — Matcha Light（白天浅绿主题）────────

# 字体
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# 窗口
background_opacity 0.80
window_padding_width 10
window_margin_width 8
confirm_os_window_close 0
hide_window_decorations no

# 光标
cursor        #4f9d57
cursor_shape  block
cursor_blink_interval 0

# 提示音（关掉，别哔哔）
enable_audio_bell no
visual_bell_duration 0.0

# ── Matcha Light 配色 ─────────────────────────────────
foreground            #3d4a44
background            #f2f6ec
selection_foreground  #33413a
selection_background  #b8d6a0

# 普通色（black / red / green / yellow / blue / magenta / cyan / white）
color0  #e6ecdd
color1  #d86666
color2  #4f9d57
color3  #c39a3f
color4  #4d87c8
color5  #967bc0
color6  #3fa98e
color7  #3d4a44

# 亮色
color8  #a8b5a4
color9  #e07f7f
color10 #62bb74
color11 #d0a95a
color12 #6a9ed4
color13 #ab93d0
color14 #56bca4
color15 #2f3a34

# Tab 栏
active_tab_foreground   #f2f6ec
active_tab_background   #4f9d57
inactive_tab_foreground #5e7065
inactive_tab_background #e6ecdd
tab_bar_background      #e6ecdd
tab_bar_margin_width    0.0
tab_bar_min_tabs        1
