# ── Fuzzel — Quickshell Blue（Material 风格，深色）─────

[main]
font=CaskaydiaCove Nerd Font:size=11
dpi-aware=yes
prompt="󰍉 "
placeholder="搜索应用…"
icon-theme=Tela-dark
icons-enabled=yes
terminal=kitty
lines=12
width=40
horizontal-pad=24
vertical-pad=16
inner-pad=6
line-height=26
match-mode=fzf
anchor=center
layer=overlay
use-bold=no

[colors]
background=1a1b26e6
text=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
input=c0caf5ff
match=7dcfffff
selection=2a3150ff
selection-text=c0caf5ff
selection-match=7dcfffff
border=3b4261ff

[border]
width=1
radius=20
selection-radius=12

[dmenu]
exit-immediately-if-empty=no
